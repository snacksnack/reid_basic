name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # RC1-452: every suite reports test-level results to Test Optimization,
    # agentless. One test service per repo. Verified: failing tests still
    # exit nonzero under both reporters; a missing key logs and runs the
    # suites untouched.
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
      DD_SITE: datadoghq.com
      DD_SERVICE: reid_basic
      DD_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: npm ci
      - run: pip install -r requirements.txt

      - name: Frontend tests
        env:
          # vitest needs both: the ESM loader hooks and the CI-mode tracer
          # init. register.js alone installs hooks but never starts reporting.
          NODE_OPTIONS: "--import dd-trace/register.js -r dd-trace/ci/init"
        run: npm test

      - name: Server tests
        run: pytest --ddtrace tests/test_server.py tests/test_observability.py -v

      - name: Resume docx/prompt sync guardrail
        run: pytest --ddtrace tests/test_resume_sync.py -v
