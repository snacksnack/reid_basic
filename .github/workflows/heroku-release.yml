# Heroku builds and releases this site itself on a push to main — entirely
# outside GitHub Actions, so CI Visibility structurally cannot see the deploy.
# This workflow closes that gap (RC1-354): it polls the Heroku Platform API for
# the release of the pushed commit and reports the ACTUAL outcome to Datadog
# DORA. It deliberately does not fire-and-forget on push: that would record a
# successful deploy even when the Heroku build fails.

name: Heroku Release

on:
  push:
    branches: [main]

jobs:
  report:
    name: Report Heroku release to DORA
    runs-on: ubuntu-latest
    # Rapid consecutive pushes queue rather than interleave; note that Heroku
    # may skip straight to the newest commit, in which case a superseded run
    # times out and fails — accurate, since that commit never went live as its
    # own release.
    concurrency: heroku-release-report
    steps:
      # DORA needs the deploy's start time; the push is when delivery began,
      # mirroring the Fly workflows' definition of started_at.
      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Wait for the Heroku release of this commit
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          APP: hihelloreid
        run: |
          set -uo pipefail
          sha8="${GITHUB_SHA:0:8}"
          deadline=$((SECONDS + 600))
          while :; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no successful Heroku release for $sha8 within 10m — the build failed, is stuck, or was superseded. Last response:"
              echo "$body"
              exit 1
            fi
            body=$(curl -s -m 30 "https://api.heroku.com/apps/$APP/releases" \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              -H "Range: version ..; order=desc, max=25")
            # Releases for GitHub-integration builds are described "Deploy <sha8>".
            match=$(jq -r --arg d "Deploy $sha8" \
              '[.[]? | select(.description == $d)] | first // empty | .status' \
              <<<"$body" 2>/dev/null || echo "")
            case "$match" in
              succeeded) echo "release for $sha8 succeeded"; break;;
              failed)    echo "::error::Heroku release for $sha8 FAILED — www.hihelloreid.com is still on the previous slug"; exit 1;;
              pending)   echo "release for $sha8 pending...";;
              *)         echo "no release for $sha8 yet...";;
            esac
            sleep 15
          done

      # Same contract as the Fly workflows (RC1-336): the event means the site
      # actually released, commit_sha + repository_url make lead time
      # computable, timestamps are nanoseconds, and a failed POST fails the
      # workflow — a live-but-unrecorded deploy silently undercounts the
      # delivery dashboard.
      - name: Report deploy to Datadog DORA
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          SERVICE: hihelloreid
          REPO_URL: https://github.com/snacksnack/reid_basic
        run: |
          set -euo pipefail
          payload=$(printf '{"data":{"attributes":{"service":"%s","env":"prod","started_at":%s000000000,"finished_at":%s000000000,"git":{"commit_sha":"%s","repository_url":"%s"}}}}' \
            "$SERVICE" "$DEPLOY_STARTED_AT" "$(date +%s)" "$GITHUB_SHA" "$REPO_URL")
          code=$(curl -s -o resp.json -w '%{http_code}' -m 30 -X POST \
            -H "DD-API-KEY: $DD_API_KEY" -H "Content-Type: application/json" \
            -d "$payload" "https://api.datadoghq.com/api/v2/dora/deployment")
          cat resp.json; echo
          case "$code" in
            2*) echo "DORA deployment recorded (HTTP $code)";;
            *) echo "::error::DORA deployment POST failed with HTTP $code — this deploy is live but unrecorded"; exit 1;;
          esac
