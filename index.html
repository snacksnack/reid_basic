<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!--
      The managed meta tags below carry the homepage card. The site is a SPA
      served through this single shell, so scrapers that don't run JS see this
      card for every URL unless the server rewrites it per route. app.py's
      serve_spa() does exactly that for known routes (RC1-512), keyed on the
      `property`/`name` attribute, so each tag it overrides stays on one line.
    -->
    <title>Reid Collins — Senior Technical Program Manager</title>
    <meta name="description" content="Reid Collins — Senior Technical Program Manager and Platform Engineer in Brooklyn, NY. Backend systems, platform reliability, and large-scale migrations on AWS." />
    <link rel="canonical" href="https://www.hihelloreid.com/" />

    <!-- Open Graph (link previews) -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Reid Collins" />
    <meta property="og:url" content="https://www.hihelloreid.com/" />
    <meta property="og:title" content="Reid Collins — Senior Technical Program Manager & Platform Engineer" />
    <meta property="og:description" content="Backend systems, platform reliability, and large-scale migrations on AWS. Based in Brooklyn, NY — open to senior TPM and platform engineering roles." />
    <meta property="og:image" content="https://www.hihelloreid.com/images/og-image-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reid Collins — Senior Technical Program Manager and Platform Engineer, Brooklyn NY" />
    <meta property="profile:first_name" content="Reid" />
    <meta property="profile:last_name" content="Collins" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reid Collins — Senior Technical Program Manager & Platform Engineer" />
    <meta name="twitter:description" content="Backend systems, platform reliability, and large-scale migrations on AWS. Based in Brooklyn, NY." />
    <meta name="twitter:image" content="https://www.hihelloreid.com/images/og-image-v2.png" />

    <!-- Structured data (Person) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Reid Collins",
        "jobTitle": "Senior Technical Program Manager / Platform Engineer",
        "url": "https://www.hihelloreid.com",
        "email": "mailto:hire.reid.collins@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Brooklyn",
          "addressRegion": "NY",
          "addressCountry": "US"
        },
        "sameAs": [
          "https://linkedin.com/in/reidcollins",
          "https://github.com/snacksnack"
        ],
        "knowsAbout": [
          "Distributed systems",
          "Platform reliability",
          "Backend engineering",
          "Technical program management",
          "AWS"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
